# Production stack — no hot reload, built frontend, hardened defaults.
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-exoplanets}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-exoplanets}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-exoplanets}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      ORBITAL_SEED: ${ORBITAL_SEED:-42}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - retrieval_outputs:/app/outputs/retrievals
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-exoplanets}
      REDIS_URL: redis://redis:6379/0
      ORBITAL_SEED: ${ORBITAL_SEED:-42}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - retrieval_outputs:/app/outputs/retrievals
    command: celery -A pipe.celery_worker worker --loglevel=info --concurrency=2
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  retrieval_outputs:
